# Minimal golangci-lint v2 config: the default linters (errcheck, govet,
# ineffassign, staticcheck, unused) plus a few cheap, high-signal extras.
version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - unconvert
  exclusions:
    rules:
      # Test helpers (cp.do, rawGet, ReadResponse over a raw conn, ...) read and
      # close the body themselves, or the conn owns it; bodyclose cannot see
      # through the helper and the workaround is a redundant Close per call site.
      - linters: [bodyclose]
        path: _test\.go
issues:
  # 0 = no cap. The defaults (50 per linter, 3 per identical message) hid about
  # 80 of 120 findings, so a "clean" run could still be dirty.
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
