name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR pushes are cancelled; every commit on main gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8.0.0
        with:
          # Keep identical to GOLANGCI_LINT_VERSION in the Makefile (`make lint`).
          version: v2.15.0

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tollgate
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: tollgate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tollgate"
          --health-interval 2s --health-timeout 3s --health-retries 30
      consul:
        # The image's default command is a dev agent.
        image: hashicorp/consul:1.20
        ports: ["8500:8500"]
        options: >-
          --health-cmd "consul info | grep -q 'leader = true'"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TOLLGATE_TEST_DATABASE_URL: postgres://tollgate:ci-only@127.0.0.1:5432/tollgate_test?sslmode=disable
      TOLLGATE_TEST_CONSUL_ADDR: 127.0.0.1:8500
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Test with the race detector
        # -coverpkg makes tests in cmd/ count towards internal/ coverage.
        run: go test -race -coverprofile=coverage.out -coverpkg=./internal/... ./...
      - name: Enforce 80% coverage on internal/
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "internal/ coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t+0 < 80) }' || { echo "::error::coverage ${total}% is below 80%"; exit 1; }
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/gateway ./cmd/gateway
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/controlplane ./cmd/controlplane

  image:
    runs-on: ubuntu-24.04
    needs: [lint, test, build]
    strategy:
      matrix:
        target: [gateway, controlplane, demo]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.10.0
      - uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          push: false
          tags: tollgate/${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
