# Benchmark / chaos override. Always used together with the demo stack:
#   docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.bench.yml up -d --build --wait
# or `make bench-up`.
#
# What it changes versus the demo stack:
#   - gateway: access log OFF by default (ACCESS_LOG=true turns it on), so the
#     overhead numbers are not dominated by one JSON line per request.
#   - controlplane: seeded from bench.yaml (purpose-built routes) instead of seed.yaml.
#   - demo-1..3: restart "no", so a killed instance stays dead until the
#     script restarts it (the demo stack's unless-stopped would race the script).
#   - prometheus and grafana only start with `--profile monitoring`, so they
#     do not steal CPU during a measurement.
# Nothing is published to the host (the demo stack's ports are removed here):
# k6 runs on the compose network, and fault injection (/admin/fail on a demo
# instance) and control-plane calls happen from inside that network.
#
# CPU isolation: bench/lib.sh reads the Docker VM's CPU count and exports
# BENCH_CPUSET_GW (gateway), BENCH_CPUSET_REST (demos, control plane, Postgres,
# Consul) and BENCH_GOMAXPROCS_REST; k6 gets its own set via `docker run
# --cpuset-cpus`. The three sets do not overlap, so the load generator, the
# gateway and the backends cannot steal each other's CPU. Empty values (the
# default when this file is used without bench/lib.sh) mean no pinning.
#
# Run it only with the project name `tollgate-bench` (bench/lib.sh passes -p):
# `down -v` then cannot touch the demo stack's volumes.
services:
  gateway:
    cpuset: "${BENCH_CPUSET_GW:-}"
    ports: !override []   # k6 and the scripts use the compose network; nothing is published
    command:
      - -control-plane=http://controlplane:9000
      - -consul-addr=consul:8500
      - -lkg-path=/var/lib/tollgate/lkg.json
      - -shutdown-delay=2s
      - -node-id=gateway-bench
      - -access-log=${ACCESS_LOG:-false}

  controlplane:
    volumes: ["./bench.yaml:/etc/tollgate/seed.yaml:ro"]
    cpuset: "${BENCH_CPUSET_REST:-}"
    ports: !override []

  # Everything that is not the gateway, the load generator or a demo backend
  # shares the "rest" CPUs with the demo backends (they are idle during runs).
  consul:
    cpuset: "${BENCH_CPUSET_REST:-}"
    ports: !override []
  postgres: { cpuset: "${BENCH_CPUSET_REST:-}" }
  ready: { cpuset: "${BENCH_CPUSET_REST:-}" }

  demo-1: { restart: "no", command: ["-name", "demo-1", "-consul-addr", "consul:8500", "-service", "demo", "-fault-injection"],
    cpuset: "${BENCH_CPUSET_REST:-}", environment: { GOMAXPROCS: "${BENCH_GOMAXPROCS_REST:-}" } }
  demo-2: { restart: "no", command: ["-name", "demo-2", "-consul-addr", "consul:8500", "-service", "demo", "-fault-injection"],
    cpuset: "${BENCH_CPUSET_REST:-}", environment: { GOMAXPROCS: "${BENCH_GOMAXPROCS_REST:-}" } }
  demo-3: { restart: "no", command: ["-name", "demo-3", "-consul-addr", "consul:8500", "-service", "demo", "-fault-injection"],
    cpuset: "${BENCH_CPUSET_REST:-}", environment: { GOMAXPROCS: "${BENCH_GOMAXPROCS_REST:-}" } }

  prometheus: { profiles: ["monitoring"] }
  grafana: { profiles: ["monitoring"] }
