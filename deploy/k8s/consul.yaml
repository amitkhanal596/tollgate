# Single Consul dev agent (in-memory, no HA, NO ACLs): demo only. Anything in
# the namespace can register a "demo" instance pointing anywhere, and the
# gateway would proxy public traffic to it. Demo pods re-register every 15 s
# if this agent restarts and forgets them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul
  namespace: tollgate
  labels: {app: consul}
spec:
  replicas: 1
  selector:
    matchLabels: {app: consul}
  template:
    metadata:
      labels: {app: consul}
    spec:
      containers:
        - name: consul
          image: hashicorp/consul:1.20
          args: [agent, -dev, -client=0.0.0.0, -ui]
          ports: [{name: http, containerPort: 8500}]
          # /v1/status/leader returns 200 with "" before a leader exists, so
          # use the same check as Compose: fail until "leader = true".
          readinessProbe:
            exec:
              command: [sh, -c, "consul info | grep -q 'leader = true'"]
            periodSeconds: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /v1/status/leader, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: tollgate
spec:
  selector: {app: consul}
  ports: [{name: http, port: 8500, targetPort: http}]
