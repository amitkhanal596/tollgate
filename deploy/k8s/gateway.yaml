apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: tollgate
  labels: {app: gateway}
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # shutdown-delay (5s) + drain-timeout (15s) + 10s margin.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: tollgate/gateway:dev
          imagePullPolicy: IfNotPresent
          args:
            - -control-plane=http://controlplane:9000
            - -consul-addr=consul:8500
            - -lkg-path=/var/lib/tollgate/lkg.json
            - -shutdown-delay=5s
            - -drain-timeout=15s
          ports:
            - {name: traffic, containerPort: 8080}
            - {name: admin, containerPort: 9090}
          env:
            - name: TOLLGATE_DATAPLANE_TOKEN
              valueFrom: {secretKeyRef: {name: tollgate-tokens, key: dataplane-token}}
          # -node-id defaults to the hostname, which is the pod name.
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: lkg, mountPath: /var/lib/tollgate}
      volumes:
        - {name: lkg, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: tollgate
spec:
  type: NodePort
  selector: {app: gateway}
  ports:
    - {name: traffic, port: 8080, targetPort: traffic, nodePort: 30080}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-admin
  namespace: tollgate
spec:
  selector: {app: gateway}
  ports: [{name: admin, port: 9090, targetPort: admin}]
