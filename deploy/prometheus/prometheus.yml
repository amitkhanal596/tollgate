global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:9090"]   # admin listener, not the traffic port
  - job_name: controlplane
    metrics_path: /metrics
    static_configs:
      - targets: ["controlplane:9000"]
